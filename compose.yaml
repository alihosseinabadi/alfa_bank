# Alfa-Kurs local demo stack.
#
# One command for judges:
#   cp .env.example .env
#   docker compose up --build
#
# The UI is served at http://localhost:5173 and uses the real ML path
# (BM25 + prior + LinUCB + events) over an explicitly labelled SYNTHETIC
# catalogue. The demo catalogue is generated inside the stack by
# scripts/build_demo_catalog.py and shared through a named volume, so no data or
# artifacts are baked into the images. Providing the private organizer catalogue
# is optional; see README "Optional: real private catalogue". Nothing private is
# committed or shipped.

name: alfakurs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfakurs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-alfakurs}
    volumes:
      - alfakurs_pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init_events.sql:/docker-entrypoint-initdb.d/10-init-events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfakurs} -d ${POSTGRES_DB:-alfakurs}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: alfakurs-api:local
    restart: "no"
    command:
      - sh
      - -c
      - python -m alembic -c backend/product-alembic.ini upgrade head && python scripts/migrate_events.py && if [ "$$ALFA_DEMO_CATALOG_BUILD" = "true" ]; then python scripts/build_demo_catalog.py --catalog-dir "$$ALFA_CATALOG_DIR" --index-dir "$$ALFA_RETRIEVAL_INDEX_DIR" --embedding-dir "$$ALFA_EMBEDDING_DIR" && python scripts/seed_courses.py --csv data/courses/courses.csv; fi
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alfakurs}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-alfakurs}
      ALFA_EVENTS_DATABASE_URL: postgresql+psycopg://${ALFA_EVENTS_USER:-alfa_events}:${ALFA_EVENTS_PASSWORD:-local_events_only}@db:5432/${ALFA_EVENTS_DB:-alfa_events}
      # The synthetic catalogue is generated here, never baked into the image.
      ALFA_DEMO_CATALOG_BUILD: ${ALFA_DEMO_CATALOG_BUILD:-true}
      ALFA_CATALOG_DIR: ${ALFA_CATALOG_DIR:-/app/demo-bundles/catalog}
      ALFA_RETRIEVAL_INDEX_DIR: ${ALFA_RETRIEVAL_INDEX_DIR:-/app/demo-bundles/retrieval}
      ALFA_EMBEDDING_DIR: ${ALFA_EMBEDDING_DIR:-/app/demo-bundles/embedding}
    volumes:
      - alfakurs_demo_bundles:/app/demo-bundles
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: alfakurs-api:local
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alfakurs}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-alfakurs}
      ALFA_EVENTS_DATABASE_URL: postgresql+psycopg://${ALFA_EVENTS_USER:-alfa_events}:${ALFA_EVENTS_PASSWORD:-local_events_only}@db:5432/${ALFA_EVENTS_DB:-alfa_events}
      # Dev-only default. Override in .env with a real random secret.
      ALFA_SESSION_SECRET: ${ALFA_SESSION_SECRET:-dev-only-insecure-session-secret-change-me-0001}
      ALFA_SESSION_COOKIE_SECURE: ${ALFA_SESSION_COOKIE_SECURE:-false}
      ALFA_RECOMMENDATIONS_ENABLED: ${ALFA_RECOMMENDATIONS_ENABLED:-true}
      ALFA_DEMO_FAST_LEARNING: ${ALFA_DEMO_FAST_LEARNING:-false}
      ALFA_CATALOG_DIR: ${ALFA_CATALOG_DIR:-/app/demo-bundles/catalog}
      ALFA_RETRIEVAL_INDEX_DIR: ${ALFA_RETRIEVAL_INDEX_DIR:-/app/demo-bundles/retrieval}
      ALFA_EMBEDDING_DIR: ${ALFA_EMBEDDING_DIR:-/app/demo-bundles/embedding}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      # Built by the migrate step; the API only reads it.
      - alfakurs_demo_bundles:/app/demo-bundles:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    image: alfakurs-api:local
    restart: unless-stopped
    command: ["python", "scripts/reward_worker.py", "--interval", "30"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alfakurs}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-alfakurs}
      ALFA_EVENTS_DATABASE_URL: postgresql+psycopg://${ALFA_EVENTS_USER:-alfa_events}:${ALFA_EVENTS_PASSWORD:-local_events_only}@db:5432/${ALFA_EVENTS_DB:-alfa_events}
      ALFA_DEMO_FAST_LEARNING: ${ALFA_DEMO_FAST_LEARNING:-false}
      ALFA_SESSION_SECRET: ${ALFA_SESSION_SECRET:-dev-only-insecure-session-secret-change-me-0001}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_RECOMMENDATIONS_SOURCE: ${VITE_RECOMMENDATIONS_SOURCE:-api}
        VITE_DEMO_CATALOG: ${VITE_DEMO_CATALOG:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  alfakurs_pgdata:
    name: alfakurs_pgdata
  alfakurs_demo_bundles:
    name: alfakurs_demo_bundles
